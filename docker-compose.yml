# Authentication Service + its own MySQL database.
# All credentials and the JWT secret come from the .env file (copy .env.example to .env).

services:
  auth-db:
    image: mysql:8.0
    container_name: shopease-auth-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"      # optional: lets MySQL Workbench reach the container
    volumes:
      - auth_db_data:/var/lib/mysql           # named volume: data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  auth-service:
    build: .
    container_name: shopease-auth-service
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_healthy            # start only after MySQL answers the health check
    environment:
      MYSQL_HOST: auth-db                     # the Compose service name, NOT localhost
      MYSQL_PORT: "3306"                      # port inside the Docker network
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    ports:
      - "8001:8001"

volumes:
  auth_db_data:
